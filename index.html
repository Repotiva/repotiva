<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{
  --ink:#1A1B2E; --soft:#7C7F92; --line:#EAE6DF; --page:#FBF8F3;
  --brand:#E00A4E; --orange:#F97C0B; --sun:#F9A21B; --coral:#FF6A5A;
}
*{box-sizing:border-box}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  background:var(--page);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
[dir=rtl] body,[dir=rtl] input{font-family:"Noto Sans Arabic","Plus Jakarta Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:340px;z-index:-1;pointer-events:none;
  background:radial-gradient(560px 260px at 12% -8%, rgba(224,10,78,.11), transparent 70%),
             radial-gradient(460px 240px at 88% -12%, rgba(249,124,11,.18), transparent 70%)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2.5px solid var(--sun);outline-offset:3px;border-radius:8px}

/* ---------- top ---------- */
.top{flex:0 0 auto;z-index:50;background:rgba(251,248,243,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.top-in{max-width:900px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:12px}
.logo .wordmark{height:32px;width:auto;display:block}
.logo .name{font-weight:800;font-size:20px;color:var(--brand);letter-spacing:-.03em}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.srch{position:relative}
.srch input{width:190px;padding:8px 12px;padding-inline-start:32px;border:1px solid var(--line);
  border-radius:999px;background:#fff;font:inherit;font-size:13px;color:var(--ink)}
.srch svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);opacity:.4}
.lang{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;color:var(--soft)}
.lang button.on{background:var(--ink);color:#fff}

/* ---------- layout ---------- */
.shell{width:100%;max-width:900px;margin:0 auto;padding:12px 14px 0;flex:1 1 auto;min-height:0;
  display:grid;grid-template-columns:186px 1fr;grid-template-rows:auto 1fr;
  column-gap:20px;row-gap:11px;align-items:stretch}
.hello{grid-column:2;grid-row:1;text-align:center;padding:2px 0 0}
.side{grid-row:1/3}
.feedtitle{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:#A29D95}
.hello .b{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:700;
  box-shadow:0 2px 6px rgba(26,27,46,.05)}
.hello .b i{width:6px;height:6px;border-radius:50%;background:#25C08B;display:block;
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.82)}}

/* ---------- categories ---------- */
.side{min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:8px}
.side::-webkit-scrollbar{display:none}
.side h3{font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;
  color:#B0ABA2;margin:0 0 9px 6px}
.side button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border-radius:14px;
  font-size:13px;font-weight:700;color:#5E6072;margin-bottom:7px;text-align:start;
  background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(26,27,46,.04);
  transition:background .16s,color .16s,border-color .16s}
.side button .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  font-size:16px;flex:0 0 auto;overflow:hidden}
.side button .ic img,.side button .ic svg{width:26px;height:26px;object-fit:contain;display:block}
.side button.on{background:var(--ink);border-color:var(--ink);color:#fff;
  box-shadow:0 4px 10px rgba(26,27,46,.18)}
.side button .n{margin-inline-start:auto;font-size:11px;font-weight:700;color:#BAB5AC}
.side button.on .n{color:rgba(255,255,255,.55)}
@media (hover:hover) and (pointer:fine){
  .side button:hover{background:#F2EEE7;color:var(--ink)}
  .item:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(26,27,46,.12)}
}

/* ---------- feed ---------- */
.scroller{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding-bottom:22px;scrollbar-width:thin}
.scroller::-webkit-scrollbar{width:7px}
.scroller::-webkit-scrollbar-thumb{background:#DCD6CC;border-radius:99px}
.feed{display:flex;flex-direction:column;gap:16px}
.item{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 2px 6px rgba(26,27,46,.05);
  transition:box-shadow .22s ease,transform .22s ease}
.pic{aspect-ratio:4/3;position:relative;display:grid;place-items:end start;overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic .fav{position:absolute;top:10px;inset-inline-end:10px;width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink);
  box-shadow:0 3px 9px rgba(26,27,46,.14);z-index:2}
.pic .fav.on{color:var(--coral)}
.pic .fav.on svg{fill:var(--coral)}
.ribbon{position:absolute;top:10px;inset-inline-start:10px;background:var(--orange);color:#fff;
  font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:999px;z-index:2;
  box-shadow:0 3px 9px rgba(249,124,11,.38)}
.box{padding:9px 11px 10px}
.row{display:flex;align-items:flex-end;gap:9px}
.txt{flex:1 1 auto;min-width:0}
.box h2{font-size:12.5px;font-weight:800;margin:0 0 3px;line-height:1.28;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.box p{margin:0;font-size:10.5px;line-height:1.42;color:#8A8D9C;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.box p b{color:var(--brand);font-weight:800}
.buy{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
  padding:5px 11px;border-radius:999px;font-size:10.5px;font-weight:800;color:#07381F;
  background:linear-gradient(180deg,#8FF0B4 0%,#41D882 52%,#20BE6B 100%);
  box-shadow:0 3px 8px rgba(28,180,101,.34),inset 0 1px 0 rgba(255,255,255,.85)}
.buy:active{transform:scale(.97)}
.disc{margin-top:6px;font-size:8px;color:#C4BFB7;text-align:start}
.none{text-align:center;padding:34px 16px;color:var(--soft);font-size:12.5px;font-weight:600}

/* ---------- mobile ---------- */
@media (max-width:700px){
  .top-in{padding:8px 11px}
  .srch{display:none}
  .logo .wordmark{height:29px}
  .shell{grid-template-columns:56px 1fr;column-gap:9px;row-gap:9px;padding:10px 11px 0}
  .side h3{display:none}
  .side button{flex-direction:column;gap:3px;padding:6px 1px;font-size:8px;text-align:center;
    line-height:1.2;border-radius:14px;min-height:58px;justify-content:center;margin-bottom:6px}
  .side button .ic{width:32px;height:32px}
  .side button .n{display:none}
  .box h2{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function count(id){ return id==='all' ? PRODUCTS.length : PRODUCTS.filter(p=>p.cat===id).length }

function drawCats(){
  document.getElementById('cathead').textContent = T[lang].cats;
  document.getElementById('cats').innerHTML = CATS.filter(c=>c.id!=='all').map(c=>{
    const n = count(c.id);
    return `<button data-cat="${c.id}" class="${c.id===cat?'on':''}">
      <span class="ic" style="background:${c.tint}">${c.ic}</span>
      <span class="lb">${esc(c[lang])}</span>
      <span class="n">${n||'—'}</span></button>`;
  }).join('');
  document.querySelectorAll('#cats button').forEach(b=>b.onclick=()=>{
    cat = (cat===b.dataset.cat) ? 'all' : b.dataset.cat;
    drawCats(); drawFeed();
    document.querySelector('.scroller').scrollTop=0;
  });
}

function drawFeed(){
  const t=T[lang];
  const cur = CATS.find(c=>c.id===cat);
  document.getElementById('freshline').textContent = cur ? cur[lang] : '';
  const list = PRODUCTS.filter(p=>(cat==='all'||p.cat===cat) &&
    (!query || (p.en.t+p.ar.t).toLowerCase().includes(query)));
  const feed=document.getElementById('feed');
  if(!list.length){ feed.innerHTML=`<div class="none">${t.none}</div>`; return; }
  feed.innerHTML = list.map((p,i)=>{
    const L=p[lang], bg=TINTS[i%TINTS.length];
    const media = p.img
      ? `<img src="${esc(p.img)}" alt="${esc(L.t)}" loading="lazy">`
      : `<span style="position:absolute;bottom:10px;inset-inline-start:10px;font-size:10px;
           font-weight:600;color:#fff;background:rgba(26,27,46,.4);padding:3px 8px;
           border-radius:7px;z-index:2">AI · ${esc(p.scene||'')}</span>`;
    return `<article class="item">
      <div class="pic" style="background:${bg}">
        ${i===0?`<span class="ribbon">${t.pick}</span>`:''}
        ${media}
        <button class="fav" aria-label="save"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7.5-4.6-7.5-9.6A4.4 4.4 0 0 1 12 7.4a4.4 4.4 0 0 1 7.5 3c0 5-7.5 9.6-7.5 9.6Z"/></svg></button>
      </div>
      <div class="box">
        <div class="row">
          <div class="txt">
            <h2>${esc(L.t)}</h2>
            <p><b>${t.why}</b> ${esc(L.w)}</p>
          </div>
          <a class="buy" href="${esc(p.url)}" target="_blank" rel="sponsored nofollow noopener">${t.buy}
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
        </div>
        <div class="disc">${t.disc}</div>
      </div>
    </article>`;
  }).join('');
  feed.querySelectorAll('.fav').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
}

function setLang(l){
  lang=l;
  document.documentElement.lang = l;
  document.documentElement.dir = l==='ar' ? 'rtl' : 'ltr';
  document.getElementById('q').placeholder = T[l].search;
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  drawCats(); drawFeed();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.getElementById('q').oninput = e=>{ query=e.target.value.trim().toLowerCase(); drawFeed(); };

drawCats(); drawFeed();
</script>
</body>
</html>
